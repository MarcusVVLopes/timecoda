<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 720" width="660" height="720" role="img" aria-labelledby="t d">
<title id="t">The optimal_composition() pipeline</title>
<desc id="d">A flowchart. One comp_iv fit, or a list of fits with one per outcome, enters optimal_composition(). Seven steps follow in order: estimate the feasible region from the sample's compositions; place candidate compositions on a grid in closure units inside the region; predict each outcome at every candidate on a few emmeans grids; keep each outcome's zone, the best share of its predictions or those meeting a threshold; intersect the outcomes' zones, a step that applies only when there are several outcomes; summarise each zone by its centre, the closed geometric mean, and its per-part range; and contrast the prediction at the zone centre with the reference day as the gain. The result is an optimal_comp object read by print() and plot().</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#8c98a4"/>
</marker>
</defs>
<rect width="660" height="720" fill="#ffffff"/>

<rect x="30" y="16" width="380" height="44" rx="22" fill="#e6edf3" stroke="#5b7c99" stroke-width="1.2"/>
<text x="220" y="43" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2933">Input: a comp_iv fit, or one fit per outcome</text>
<line x1="220" y1="60" x2="220" y2="82" stroke="#8c98a4" stroke-width="1.4" marker-end="url(#ar)"/>

<rect x="30" y="86" width="380" height="54" rx="6" fill="#f4f6f8" stroke="#9aa5b1" stroke-width="1.1"/>
<text x="46" y="108" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2933">1 · The feasible region</text>
<text x="46" y="127" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5f6b76">estimated from the sample's compositions</text>
<text x="426" y="108" font-family="Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#7b8794">region = "box" (default),</text>
<text x="426" y="124" font-family="Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#7b8794">"observed"</text>
<text x="426" y="138" font-family="Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#7b8794">or a data frame</text>
<line x1="220" y1="140" x2="220" y2="162" stroke="#8c98a4" stroke-width="1.4" marker-end="url(#ar)"/>

<rect x="30" y="166" width="380" height="54" rx="6" fill="#f4f6f8" stroke="#9aa5b1" stroke-width="1.1"/>
<text x="46" y="188" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2933">2 · Candidate compositions</text>
<text x="46" y="207" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5f6b76">a grid in closure units inside the region</text>
<text x="426" y="188" font-family="Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#7b8794">spacing: the grid step,</text>
<text x="426" y="204" font-family="Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#7b8794">by default 1/144 of the</text>
<text x="426" y="218" font-family="Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#7b8794">total (10 min of 1,440)</text>
<line x1="220" y1="220" x2="220" y2="242" stroke="#8c98a4" stroke-width="1.4" marker-end="url(#ar)"/>

<rect x="30" y="246" width="380" height="54" rx="6" fill="#f4f6f8" stroke="#9aa5b1" stroke-width="1.1"/>
<text x="46" y="268" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2933">3 · Predict each outcome</text>
<text x="46" y="287" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5f6b76">at every candidate, on a few emmeans grids per outcome</text>
<line x1="220" y1="300" x2="220" y2="322" stroke="#8c98a4" stroke-width="1.4" marker-end="url(#ar)"/>

<rect x="30" y="326" width="380" height="54" rx="6" fill="#f4f6f8" stroke="#9aa5b1" stroke-width="1.1"/>
<text x="46" y="348" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2933">4 · Each outcome's zone</text>
<text x="46" y="367" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5f6b76">the best share of predictions, set by zone and direction</text>
<text x="426" y="348" font-family="Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#7b8794">threshold: a cut-off or</text>
<text x="426" y="364" font-family="Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#7b8794">band on the scale set</text>
<text x="426" y="378" font-family="Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#7b8794">by type instead</text>
<line x1="220" y1="380" x2="220" y2="402" stroke="#8c98a4" stroke-width="1.4" marker-end="url(#ar)"/>

<rect x="30" y="406" width="380" height="54" rx="6" fill="#fbfbfc" stroke="#9aa5b1" stroke-width="1.1" stroke-dasharray="5 3"/>
<text x="46" y="428" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2933">5 · Intersect the zones</text>
<text x="46" y="447" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5f6b76">the candidates in every zone, widened only if widen = TRUE</text>
<text x="426" y="428" font-family="Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#7b8794">conditional:</text>
<text x="426" y="444" font-family="Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#7b8794">several outcomes only;</text>
<text x="426" y="458" font-family="Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#7b8794">no overlap reports q_overlap</text>
<line x1="220" y1="460" x2="220" y2="482" stroke="#8c98a4" stroke-width="1.4" marker-end="url(#ar)"/>

<rect x="30" y="486" width="380" height="54" rx="6" fill="#f4f6f8" stroke="#9aa5b1" stroke-width="1.1"/>
<text x="46" y="508" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2933">6 · The zone's centre</text>
<text x="46" y="527" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5f6b76">its closed geometric mean, with each part's range</text>
<line x1="220" y1="540" x2="220" y2="562" stroke="#8c98a4" stroke-width="1.4" marker-end="url(#ar)"/>

<rect x="30" y="566" width="380" height="54" rx="6" fill="#f4f6f8" stroke="#9aa5b1" stroke-width="1.1"/>
<text x="46" y="588" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2933">7 · The gain</text>
<text x="46" y="607" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5f6b76">the zone centre contrasted with the day set by from</text>
<text x="426" y="588" font-family="Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#7b8794">by default the reference</text>
<text x="426" y="604" font-family="Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#7b8794">composition of each fit</text>
<line x1="220" y1="620" x2="220" y2="642" stroke="#8c98a4" stroke-width="1.4" marker-end="url(#ar)"/>

<rect x="30" y="646" width="380" height="48" rx="24" fill="#e6edf3" stroke="#5b7c99" stroke-width="1.2"/>
<text x="220" y="669" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2933">An optimal_comp object</text>
<text x="220" y="685" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#5f6b76">read by print() and plot()</text>
</svg>
