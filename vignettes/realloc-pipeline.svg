<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 640" width="660" height="640" role="img" aria-labelledby="t d">
<title id="t">The predict_realloc() pipeline</title>
<desc id="d">A flowchart. A comp_iv fit, delta, from and to enter predict_realloc(). Six steps follow in order: take the reference composition, the geometric mean stored in the fit; build each reallocated composition by moving delta minutes from one part to the other; check that every part stays positive, an invalid transfer being handled according to on_invalid; express the reference and every reallocated composition in ILR coordinates and evaluate them on an emmeans reference grid with covariates averaged; contrast each reallocated composition against the reference on the link scale, or, when type is absolute, predict the response at each composition instead; and back-transform to the model's effect measure. The result is a realloc tibble read by summary(), pub_ready() and plot_realloc().</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#8c98a4"/>
</marker>
</defs>
<rect width="660" height="640" fill="#ffffff"/>

<rect x="30" y="16" width="380" height="44" rx="22" fill="#e6edf3" stroke="#5b7c99" stroke-width="1.2"/>
<text x="220" y="43" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2933">Input: a comp_iv fit, delta, from and to</text>
<line x1="220" y1="60" x2="220" y2="82" stroke="#8c98a4" stroke-width="1.4" marker-end="url(#ar)"/>

<rect x="30" y="86" width="380" height="54" rx="6" fill="#f4f6f8" stroke="#9aa5b1" stroke-width="1.1"/>
<text x="46" y="108" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2933">1 · The reference composition</text>
<text x="46" y="127" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5f6b76">the geometric mean stored in the fit</text>
<line x1="220" y1="140" x2="220" y2="162" stroke="#8c98a4" stroke-width="1.4" marker-end="url(#ar)"/>

<rect x="30" y="166" width="380" height="54" rx="6" fill="#f4f6f8" stroke="#9aa5b1" stroke-width="1.1"/>
<text x="46" y="188" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2933">2 · Build each reallocated composition</text>
<text x="46" y="207" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5f6b76">move delta minutes from one part to the other</text>
<line x1="220" y1="220" x2="220" y2="242" stroke="#8c98a4" stroke-width="1.4" marker-end="url(#ar)"/>

<rect x="30" y="246" width="380" height="54" rx="6" fill="#fbfbfc" stroke="#9aa5b1" stroke-width="1.1" stroke-dasharray="5 3"/>
<text x="46" y="268" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2933">3 · Check that every part stays positive</text>
<text x="46" y="287" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5f6b76">a transfer larger than the donor part is invalid</text>
<text x="426" y="268" font-family="Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#7b8794">conditional:</text>
<text x="426" y="284" font-family="Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#7b8794">an invalid transfer follows</text>
<text x="426" y="298" font-family="Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#7b8794">on_invalid: error | omit | na</text>
<line x1="220" y1="300" x2="220" y2="322" stroke="#8c98a4" stroke-width="1.4" marker-end="url(#ar)"/>

<rect x="30" y="326" width="380" height="54" rx="6" fill="#f4f6f8" stroke="#9aa5b1" stroke-width="1.1"/>
<text x="46" y="348" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2933">4 · ILR coordinates and the emmeans grid</text>
<text x="46" y="367" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5f6b76">reference and reallocated days on one grid, covariates averaged</text>
<line x1="220" y1="380" x2="220" y2="402" stroke="#8c98a4" stroke-width="1.4" marker-end="url(#ar)"/>

<rect x="30" y="406" width="380" height="54" rx="6" fill="#f4f6f8" stroke="#9aa5b1" stroke-width="1.1"/>
<text x="46" y="428" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2933">5 · Contrast on the link scale</text>
<text x="46" y="447" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5f6b76">reallocated minus reference, with a delta-method standard error</text>
<text x="426" y="428" font-family="Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#7b8794">type = "absolute":</text>
<text x="426" y="444" font-family="Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#7b8794">the predicted response at</text>
<text x="426" y="458" font-family="Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#7b8794">each composition instead</text>
<line x1="220" y1="460" x2="220" y2="482" stroke="#8c98a4" stroke-width="1.4" marker-end="url(#ar)"/>

<rect x="30" y="486" width="380" height="54" rx="6" fill="#f4f6f8" stroke="#9aa5b1" stroke-width="1.1"/>
<text x="46" y="508" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2933">6 · Back-transform</text>
<text x="46" y="527" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5f6b76">odds ratio for a logit link, mean difference for a linear model</text>
<line x1="220" y1="540" x2="220" y2="562" stroke="#8c98a4" stroke-width="1.4" marker-end="url(#ar)"/>

<rect x="30" y="566" width="380" height="48" rx="24" fill="#e6edf3" stroke="#5b7c99" stroke-width="1.2"/>
<text x="220" y="589" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2933">A realloc tibble</text>
<text x="220" y="605" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#5f6b76">read by summary(), pub_ready() and plot_realloc()</text>
</svg>
