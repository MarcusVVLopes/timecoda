<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 556" width="660" height="556" role="img" aria-labelledby="t d">
<title id="t">The declare_composition() pipeline</title>
<desc id="d">A flowchart. A data frame and part names enter declare_composition(). Five steps follow in order: validate the parts with check_composition(); resolve the scale from the closure and labels arguments; impute zeroes with comp_impute(), only when a part contains a zero; flag outliers with comp_outliers(), only when detect_outliers is TRUE; and close the composition with acomp() to the declared total. The result is a compD object.</desc>
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M0 0 L10 5 L0 10 z" fill="#8c98a4"/>
</marker>
</defs>
<rect width="660" height="556" fill="#ffffff"/>

<rect x="30" y="16" width="380" height="44" rx="22" fill="#e6edf3" stroke="#5b7c99" stroke-width="1.2"/>
<text x="220" y="43" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2933">Input: a data frame and the part names</text>
<line x1="220" y1="60" x2="220" y2="82" stroke="#8c98a4" stroke-width="1.4" marker-end="url(#ar)"/>

<rect x="30" y="86" width="380" height="54" rx="6" fill="#f4f6f8" stroke="#9aa5b1" stroke-width="1.1"/>
<text x="46" y="108" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2933">1 · Validate: check_composition()</text>
<text x="46" y="127" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5f6b76">parts present, numeric, complete, non-negative</text>
<line x1="220" y1="140" x2="220" y2="162" stroke="#8c98a4" stroke-width="1.4" marker-end="url(#ar)"/>

<rect x="30" y="166" width="380" height="54" rx="6" fill="#f4f6f8" stroke="#9aa5b1" stroke-width="1.1"/>
<text x="46" y="188" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2933">2 · Resolve the scale and the display labels</text>
<text x="46" y="207" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5f6b76">from closure and labels</text>
<line x1="220" y1="220" x2="220" y2="242" stroke="#8c98a4" stroke-width="1.4" marker-end="url(#ar)"/>

<rect x="30" y="246" width="380" height="54" rx="6" fill="#fbfbfc" stroke="#9aa5b1" stroke-width="1.1" stroke-dasharray="5 3"/>
<text x="46" y="268" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2933">3 · Impute zeroes: comp_impute()</text>
<text x="46" y="287" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5f6b76">on the original scale, so row totals are preserved</text>
<text x="426" y="268" font-family="Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#7b8794">conditional:</text>
<text x="426" y="284" font-family="Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#7b8794">only if a part</text>
<text x="426" y="298" font-family="Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#7b8794">contains a zero</text>
<line x1="220" y1="300" x2="220" y2="322" stroke="#8c98a4" stroke-width="1.4" marker-end="url(#ar)"/>

<rect x="30" y="326" width="380" height="54" rx="6" fill="#fbfbfc" stroke="#9aa5b1" stroke-width="1.1" stroke-dasharray="5 3"/>
<text x="46" y="348" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2933">4 · Flag outliers: comp_outliers()</text>
<text x="46" y="367" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5f6b76">robust Mahalanobis distance in log-ratio coordinates</text>
<text x="426" y="348" font-family="Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#7b8794">optional:</text>
<text x="426" y="364" font-family="Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#7b8794">only if</text>
<text x="426" y="378" font-family="Helvetica,Arial,sans-serif" font-size="11" font-style="italic" fill="#7b8794">detect_outliers = TRUE</text>
<line x1="220" y1="380" x2="220" y2="402" stroke="#8c98a4" stroke-width="1.4" marker-end="url(#ar)"/>

<rect x="30" y="406" width="380" height="54" rx="6" fill="#f4f6f8" stroke="#9aa5b1" stroke-width="1.1"/>
<text x="46" y="428" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2933">5 · Close the composition: acomp()</text>
<text x="46" y="447" font-family="Helvetica,Arial,sans-serif" font-size="11.5" fill="#5f6b76">rescale every row to the declared total</text>
<line x1="220" y1="460" x2="220" y2="482" stroke="#8c98a4" stroke-width="1.4" marker-end="url(#ar)"/>

<rect x="30" y="486" width="380" height="48" rx="24" fill="#e6edf3" stroke="#5b7c99" stroke-width="1.2"/>
<text x="220" y="509" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#1f2933">A compD object</text>
<text x="220" y="525" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="11" fill="#5f6b76">consumed by every later timecoda function</text>
</svg>
